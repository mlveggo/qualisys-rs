[package]
name = "qualisys"
version = "0.2.0"
edition = "2021"
authors = ["Morgan Larsson"]
license = "MIT"
description = "Client for the Qualisys Track Manager (QTM) real time protocol"
repository = "https://github.com/mlveggo/qualisys-rs"
keywords = ["qualisys", "qtm", "motion-capture", "mocap"]
categories = ["network-programming", "science"]

[lib]
name = "qualisys"
path = "src/lib.rs"

[[bin]]
name = "qualisys"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line client; disable to build the library with `log` only.
cli = ["dep:env_logger"]

[dependencies]
log = "0.4"
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "streaming"

[[example]]
name = "discover"
